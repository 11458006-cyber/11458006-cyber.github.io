<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <defs>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f5f1ff;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="225" fill="url(#noteGrad)" rx="12"/>
  
  <!-- 主容器 - 记事本卡片 -->
  <g filter="url(#shadow)">
    <!-- 顶部栏 -->
    <rect x="30" y="30" width="340" height="50" fill="linear-gradient(90deg, #667eea 0%, #764ba2 100%)" rx="8"/>
    
    <!-- 标题文字 -->
    <text x="50" y="60" font-family="'Noto Sans TC', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">📝 線上記事本</text>
    
    <!-- Save 按钮 -->
    <rect x="300" y="38" width="50" height="34" fill="#ffffff" rx="6"/>
    <text x="325" y="58" font-family="'Noto Sans TC', sans-serif" font-size="12" font-weight="bold" fill="#667eea" text-anchor="middle">Save</text>
    
    <!-- 编辑区域背景 -->
    <rect x="30" y="85" width="340" height="80" fill="#f9fafb" rx="6" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- 文本行 -->
    <line x1="40" y1="100" x2="340" y2="100" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="40" y1="120" x2="340" y2="120" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="40" y1="140" x2="300" y2="140" stroke="#d1d5db" stroke-width="1.5"/>
    
    <!-- 光标动画效果（竖线） -->
    <line x1="305" y1="140" x2="310" y2="140" stroke="#667eea" stroke-width="2.5" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    
    <!-- 底部状态栏 -->
    <rect x="30" y="170" width="340" height="35" fill="#f3f4f6" rx="6" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- 文件信息 -->
    <text x="40" y="190" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#6b7280">📄 記事本.txt</text>
    <text x="150" y="190" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#6b7280">⏰ 最後保存: --:--:--</text>
    <text x="280" y="190" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#6b7280">📊 字數: 0</text>
    
    <!-- 编辑状态标记 -->
    <circle cx="330" cy="187" r="3" fill="#4ade80"/>
    <text x="340" y="192" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#4ade80" font-weight="bold">已連線</text>
  </g>
  
  <!-- 装饰元素 -->
  <circle cx="380" cy="15" r="8" fill="#ffffff" opacity="0.2"/>
  <circle cx="20" cy="210" r="12" fill="#ffffff" opacity="0.15"/>
</svg>