<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vocabulary Quiz</title>
  <style>
    body{font-family:Arial, Helvetica, sans-serif; max-width:700px;margin:24px auto}
    .question{font-weight:600;margin-bottom:8px}
    .option{display:block;margin:6px 0}
    .btn{margin-top:12px}
  </style>
</head>
<body>
  <h2>Vocabulary Quiz</h2>
  <div id="app">
    <div id="quizArea"></div>
  </div>
  <script>
    // quizJson is injected by server-side template
    var quiz = [];
    try { quiz = JSON.parse(<?= quizJson ?>); } catch(e) { quiz = []; }

    var idx = 0; var score = 0;
    var quizArea = document.getElementById('quizArea');

    function renderQuestion() {
      if (idx >= quiz.length) {
        quizArea.innerHTML = '<p>完成！您的分數：' + score + ' / ' + quiz.length + '</p>';
        return;
      }
      var q = quiz[idx];
      var html = '<div class="question">' + (idx+1) + '. ' + q.question + '</div>';
      for (var i=0;i<4;i++) {
        var letter = ['A','B','C','D'][i];
        html += '<label class="option"><input type="radio" name="opt" value="'+letter+'"> <strong>'+letter+'</strong> ' + q.options[i] + '</label>';
      }
      html += '<button id="submitBtn" class="btn">提交</button> <button id="skipBtn" class="btn">跳過</button>';
      quizArea.innerHTML = html;
      document.getElementById('submitBtn').onclick = checkAnswer;
      document.getElementById('skipBtn').onclick = function(){ idx++; renderQuestion(); };
    }

    function checkAnswer(){
      var els = document.getElementsByName('opt');
      var sel = null;
      for(var i=0;i<els.length;i++) if(els[i].checked) sel = els[i].value;
      var q = quiz[idx];
      if (sel === q.answer) score++;
      idx++; renderQuestion();
    }

    if (quiz.length===0) quizArea.innerHTML='<p>找不到題目，請確認試算表中有英文與中文欄位。</p>';
    else renderQuestion();
  </script>
</body>
</html>
